<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>대신봐쫑</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7a2f">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="대신봐쫑">
  <style>
    html, body { margin: 0; height: 100%; background: #fff8ee; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: #fff8ee; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
              color: #a0703c; font-weight: 800; z-index: 2; transition: opacity .4s; }
    #direct { margin-top: 6px; font-size: 14px; color: #1a73e8; }
    #splash img { width: 120px; border-radius: 50%; animation: bob 1.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <p>쫑이 깨우는 중… 🐾</p>
    <a id="direct" href="#" style="display:none">안 열리면 여기를 눌러 주세요</a>
  </div>
  <iframe id="app" title="대신봐쫑" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    // ▼▼ 한나T 웹앱 주소 (바뀌면 여기만 고치면 됨) ▼▼
       const APP_URL = 'https://script.google.com/macros/s/AKfycbxRZwFVYL3m4yjFHyp--qUBJ9DCE-jpvwRelknFGsqhjJSgGm13vYOqEEufETMjK95F/exec';

    // 유튜브 앱에서 '공유 → 쫑이' 로 들어오면 링크에서 영상 ID를 꺼내 넘겨줌
    function videoId(s) {
      const m = String(s || '').match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : '';
    }
    const q = new URLSearchParams(location.search);
    const id = videoId(q.get('url')) || videoId(q.get('text')) || videoId(q.get('title'));
    const target = APP_URL + (id ? '?v=' + id : '');

    // 앱 안에 띄워 보기 → 쫑이 페이지가 '잘 떴다' 신호를 보내면 성공
    // 신호가 없으면(구글이 막은 경우) 쫑이 페이지를 직접 열기
    // 이 휴대폰에서 예전에 막혔으면 기다리지 않고 바로 열기
    let blockedBefore = false;
    try { blockedBefore = localStorage.getItem('jjongi_direct') === '1'; } catch (e) {}
    if (blockedBefore) location.replace(target);

    let ready = false;
    const goDirect = () => {
      if (ready) return;
      try { localStorage.setItem('jjongi_direct', '1'); } catch (e) {}
      location.replace(target);
    };
    window.addEventListener('message', e => {
      if (e.data && e.data.jjongi === 'ready') {
        ready = true;
        try { localStorage.removeItem('jjongi_direct'); } catch (e2) {}
        const sp = document.getElementById('splash');
        if (sp) { sp.style.opacity = '0'; setTimeout(() => sp.remove(), 400); }
      }
    });
    document.getElementById('app').src = target;
    document.getElementById('direct').href = target;
    setTimeout(() => { if (!ready) document.getElementById('direct').style.display = 'block'; }, 4000);
    setTimeout(goDirect, 8000);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
