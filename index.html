<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>그래서 결론이 뭔데</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7a2f">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="쫑이">
  <style>
    html, body { margin: 0; height: 100%; background: #fff8ee; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: #fff8ee; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
              color: #a0703c; font-weight: 800; z-index: 2; transition: opacity .4s; }
    #splash img { width: 120px; border-radius: 50%; animation: bob 1.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icon-192.png" alt=""><p>쫑이 깨우는 중… 🐾</p></div>
  <iframe id="app" title="그래서 결론이 뭔데" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    // ▼▼ 한나T 웹앱 주소 (바뀌면 여기만 고치면 됨) ▼▼
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxhdxpGZNJSQB9Wgxmdznqcby2-cPd7DVOqKfzbuFgCj97UF7y1Ef1wddhaVnOHn-1bJQ/exec';

    // 유튜브 앱에서 '공유 → 쫑이' 로 들어오면 링크에서 영상 ID를 꺼내 넘겨줌
    function videoId(s) {
      const m = String(s || '').match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/);
      return m ? m[1] : '';
    }
    const q = new URLSearchParams(location.search);
    const id = videoId(q.get('url')) || videoId(q.get('text')) || videoId(q.get('title'));

    const frame = document.getElementById('app');
    frame.src = APP_URL + (id ? '?v=' + id : '');
    frame.addEventListener('load', () => {
      const sp = document.getElementById('splash');
      sp.style.opacity = '0';
      setTimeout(() => sp.remove(), 400);
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
