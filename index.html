<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>대신봐쫑</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff7a2f">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="대신봐쫑">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
           margin: 0; padding: 16px 16px 40px; background: #fff8ee; color: #2b2118; }
    .wrap { max-width: 520px; margin: 0 auto; }
    .chance { display: flex; align-items: center; gap: 8px; background: linear-gradient(90deg, #ff7a2f, #ff4f7a);
              color: #fff; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 800;
              letter-spacing: -0.3px; box-shadow: 0 3px 8px rgba(255,100,80,.25); margin-bottom: 6px; }
    .chance b { background: #fff; color: #ff5a4f; border-radius: 999px; padding: 2px 8px; font-size: 12px; flex: none; }

    /* 맨 위: 의심하는 강아지 + 말풍선 */
    .hero { display: flex; align-items: flex-end; gap: 6px; margin: 4px 0 10px; }
    .hero img { width: 112px; height: auto; flex: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15)); }
    .bubble { position: relative; background: #fff; border: 2px solid #2b2118; border-radius: 18px;
              padding: 10px 14px; margin-bottom: 46px; font-weight: 800; font-size: 17px; line-height: 1.3; }
    .bubble:after { content: ''; position: absolute; left: -11px; bottom: 14px; width: 16px; height: 16px;
                    background: #fff; border-left: 2px solid #2b2118; border-bottom: 2px solid #2b2118;
                    transform: rotate(45deg); }
    .bubble .who { display: block; font-size: 12px; color: #a0703c; font-weight: 800; margin-bottom: 2px; }
    h1 { font-size: 23px; margin: 0; letter-spacing: -0.5px; }
    h1 small { display: block; font-size: 13px; font-weight: 600; color: #a0703c; margin-top: 2px; letter-spacing: 0; }
    .tag { font-size: 13px; color: #7a6552; margin: 0 0 14px; }

    .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 6px rgba(80,50,20,.08); margin-bottom: 14px; }
    label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 6px; }
    label:first-child { margin-top: 0; }
    input[type=url], select { width: 100%; font-size: 16px; padding: 12px; border: 1.5px solid #e3d5c3; border-radius: 12px; background: #fff; color: inherit; }
    input[type=url]:focus, select:focus { outline: none; border-color: #ff7a2f; }
    button { width: 100%; font-size: 18px; font-weight: 800; padding: 15px; margin-top: 16px; border: 0;
             border-radius: 14px; background: #ff7a2f; color: #fff; cursor: pointer; letter-spacing: -0.3px;
             box-shadow: 0 4px 0 #d95a14; position: relative; z-index: 1; -webkit-appearance: none; }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d95a14; }
    button:disabled { background: #c9bfb5; box-shadow: none; cursor: default; transform: none; }

    #statusCard { display: none; align-items: center; gap: 12px; flex-wrap: wrap; }
    #statusCard.split #statusDog { display: none; }
    #statusCard > #status { flex: 1; min-width: 0; }

    /* 쫑이 분신술: 같은 사진을 양옆으로 점점 흐리게 겹쳐서 잔상처럼 */
    #clones { flex-basis: 100%; display: none; }
    #statusCard.split #clones { display: block; }
    .stage { position: relative; height: 128px; margin: 4px 0 8px; }
    .ghost { position: absolute; left: 50%; bottom: 0; z-index: var(--z);
             transform: translateX(-50%) translateX(var(--x)) scale(var(--s)); opacity: var(--o);
             filter: blur(var(--b)) saturate(var(--sat));
             transition: transform .7s cubic-bezier(.4,1.5,.5,1), opacity .7s, filter .7s; }
    .ghost img { height: 112px; width: auto; display: block; transform-origin: 50% 100%;
                 animation: sway 1.4s ease-in-out infinite; animation-delay: var(--d); }
    .stage.start .ghost { --x: 0px !important; --o: 0 !important; }
    .stage.start .ghost.main { --o: 1 !important; }
    .stage.merge .ghost { --x: 0px !important; }
    .stage.merge .ghost:not(.main) { --o: 0 !important; }
    .stage.merge .ghost.main img { animation: spin .9s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: translateX(-7px) rotate(-5deg); } 50% { transform: translateX(7px) rotate(5deg); } }
    @keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(.85); } 100% { transform: rotate(360deg) scale(1); } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #f3ebe1; color: #7a6552; }
    .chip.done { background: #e3f6ec; color: #1f8a52; font-weight: 700; }
    #statusDog { width: 84px; flex: none; }
    #statusCard.busy #statusDog { animation: bob 1.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
    #status { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
    #status .fun { color: #a0703c; font-weight: 700; }
    #status.err { color: #c62828; }
    #warn { background: #fff1e0; color: #8a4b00; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }

    .done { text-align: center; }
    .done img { width: 170px; margin: -6px auto 0; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15)); }
    .done .yay { font-size: 19px; font-weight: 800; margin: 4px 0 12px; }
    .btns { display: flex; gap: 8px; }
    .open { flex: 1; display: block; text-align: center; padding: 13px 8px; border-radius: 12px; background: #1a73e8;
            color: #fff; font-weight: 800; text-decoration: none; font-size: 15px; }
    .open.sub { background: #fff; color: #1a73e8; border: 1.5px solid #1a73e8; }
    .preview h2 { font-size: 17px; margin: 0 0 6px; }
    .preview h3 { font-size: 15px; margin: 16px 0 6px; color: #a0703c; }
    .preview p, .preview li { font-size: 14px; line-height: 1.55; }
    .preview ul { padding-left: 20px; margin: 4px 0; }
    .muted { color: #8a7a6a; font-size: 12px; }
    .preview h4 { font-size: 14px; margin: 14px 0 4px; }
    .preview h4 a, .jumps a { color: #1a73e8; text-decoration: none; }
    .preview .one { background: #fff1e0; border-radius: 12px; padding: 10px 12px; }
    .thumb { width: 100%; border-radius: 12px; display: block; margin-bottom: 10px; }
    .badge { display: inline-block; background: #e3f6ec; color: #1f8a52; font-size: 12px; font-weight: 800;
             border-radius: 999px; padding: 4px 10px; margin: 6px 0 2px; }
    mark { background: #fff1a8; color: #9a5b00; border-radius: 4px; padding: 0 2px; }
    .vis { margin: 10px 0 14px; }
    .art svg { width: 100%; height: auto; display: block; }
    .vtitle { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
    .vtag { font-size: 11px; color: #ff7a2f; background: #ffe9d9; border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
    .tbl { overflow-x: auto; border: 1.5px solid #e3d5c3; border-radius: 12px; }
    .tbl table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .tbl th { background: #ffe9d9; text-align: left; white-space: nowrap; }
    .tbl th, .tbl td { padding: 7px 9px; border-bottom: 1px solid #f0e6da; vertical-align: top; }
    .jump { display: inline-block; font-size: 12px; color: #1a73e8; text-decoration: none; margin-top: 6px; font-weight: 700; }
    .jumps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .jumps a { font-size: 12px; background: #eef4ff; border-radius: 999px; padding: 3px 9px; font-weight: 700; }
    .lock { position: fixed; inset: 0; z-index: 50; background: rgba(43,33,24,.55); display: flex;
            align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
    .lockbox { background: #fff8ee; border-radius: 22px; padding: 22px 20px 18px; width: 100%; max-width: 360px;
               text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .lockbox img { width: 120px; margin: -70px auto 4px; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2)); }
    .lockbubble { font-weight: 800; font-size: 17px; line-height: 1.4; margin-bottom: 12px; }
    .lockbox input[type=password] { width: 100%; font-size: 17px; padding: 13px; border: 1.5px solid #e3d5c3; border-radius: 12px; text-align: center; }
    .remember { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; color: #7a6552; margin: 10px 0 0; }
    #pwmsg { white-space: pre-wrap; min-height: 20px; margin-top: 10px; font-size: 14px; font-weight: 700; color: #a0703c; }
    #prefillMsg { background: #eef4ff; color: #1a4fa0; font-size: 14px; font-weight: 700; }
    .ev { font-size: 12px; font-weight: 700; color: #1a73e8; text-decoration: none; white-space: nowrap; }
    .quote { font-size: 12px; color: #7a6552; background: #f6efe6; border-left: 3px solid #e3d5c3; border-radius: 6px; padding: 3px 8px; margin: 3px 0 2px; }
    .fc { background: #f3faf6; border: 1.5px solid #cfe9db; border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.6; }
    .fcs { margin-top: 8px; }
    .fc ul { margin: 2px 0; }
    .installbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #2b2118; color: #fff;
                  border-radius: 14px; padding: 10px 12px 10px 14px; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
    .installbar button { width: auto; margin: 0; padding: 8px 14px; font-size: 14px; border-radius: 10px; box-shadow: none; flex: none; }
    #status .tip { display: inline-block; margin-top: 6px; font-size: 12px; color: #7a6552; }
    footer { text-align: center; font-size: 12px; color: #b09a85; margin-top: 18px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="installbar" id="installBar" style="display:none">
    <span id="installText">📲 홈 화면에 앱으로 설치하면 더 편해요</span>
    <button type="button" id="installBtn">설치</button>
  </div>
  <div class="chance"><b>한나T 찬스 🎁</b><span>첫 작품은 제일 소중한 당신에게 먼저.</span></div>

    curMsg = msg;

    if (busy) {
      if (!jobStart) { jobStart = Date.now(); shuffleFun(); }
      const draw = () => {
        const sec = Math.floor((Date.now() - jobStart) / 1000);
        const fun = FUN[funOrder[Math.floor(sec / 5) % funOrder.length]];
        el.innerHTML = '<span class="fun">' + esc(fun) + '</span>\n' + esc(curMsg) +
          '\n경과: ' + Math.floor(sec / 60) + '분 ' + (sec % 60) + '초' +
          '\n<span class="tip">💡 화면은 안 꺼지게 해 뒀어요. 잠깐 딴 앱 갔다 와도 돌아오면 이어서 해요 · 끝나면 알림 🔔</span>';

  const ROLES = [

  // 가운데 진짜 쫑이 + 양옆으로 갈수록 흐려지는 분신들
  function drawStage(n, chipsHtml) {
    const pic = $('statusDog').src;

    for (let k = 0; k < n; k++) {
      const step = Math.ceil(k / 2);
      const side = k % 2 ? -1 : 1;
      const x = step * side * 36;
      const o = Math.max(0.18, 1 - step * 0.3);
      const sc = 1 - step * 0.09;
      ghosts += '<div class="ghost' + (k ? '' : ' main') + '" style="--x:' + x + 'px;--o:' + o + ';--s:' + sc +
        ';--b:' + (step * 0.6) + 'px;--sat:' + (1 - step * 0.25) + ';--z:' + (10 - step) +
        ';--d:-' + (step * 0.12).toFixed(2) + 's"><img src="' + pic + '" alt=""></div>';
    }
    $('clones').innerHTML = '<div class="stage start" id="stage">' + ghosts + '</div><div class="chips">' + chipsHtml + '</div>';

  }

  /* ---------- 서버 호출 (응답이 없으면 시간 초과로 알려줌) ---------- */

  // Apps Script 서버에 일 시키기 — 구글 로그인 정보(쿠키)를 아예 안 보내서 계정 문제 없음
  async function server(fn, timeoutMs, ...args) {
    for (let netTries = 0; ; netTries++) {
      try {
        return await serverOnce(fn, timeoutMs, args);
      } catch (e) {
        if (isNetErr(e) && netTries < 3 && jobRunning) { await pauseUntilBack(); continue; }
        throw e;
      }
    }
  }
  async function serverOnce(fn, timeoutMs, args) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn, args }),
        credentials: 'omit',
        redirect: 'follow',
        signal: ctrl.signal
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) {
        throw new Error('쫑이 서버 응답을 읽지 못했어요.\n· Apps Script를 "새 버전"으로 배포했는지\n· 액세스 권한이 "모든 사용자"인지 확인해 주세요.');
      }
      if (!data.ok) throw new Error(data.error || '서버 오류');
      return data.result;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('서버 응답이 없습니다 (' + fn + '). 잠시 후 다시 시도해 주세요.');
      throw e;
    } finally {
      clearTimeout(t);
    }
  }

  /* ---------- 다른 앱 갔다 와도 이어서 + 화면 켜두기 + 완료 알림 ---------- */

  let jobRunning = false, wakeLock = null, wasAway = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const isNetErr = e => e instanceof TypeError || /Failed to fetch|NetworkError|Load failed|network/i.test((e && e.message) || '');

  function waitVisible() {
    if (!document.hidden) return Promise.resolve();
    return new Promise(res => {
      const h = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', h); res(); } };
      document.addEventListener('visibilitychange', h);
    });
  }
  // 끊겼을 때: 앱 밖이면 돌아올 때까지 기다리고, 앱 안이면 잠깐 쉬었다가 다시
  async function pauseUntilBack() {
    if (document.hidden) {
      wasAway = true;
      await waitVisible();
      updateMsg('다시 왔네! 끊긴 부분부터 이어서 하는 중 🐾');
      await sleep(700);
    } else {
      updateMsg('인터넷이 잠깐 끊겼어요. 다시 연결하는 중… 📶');
      await sleep(3000);
    }
  }

  // 요약하는 동안 화면이 저절로 꺼지지 않게
  async function keepAwake(on) {
    try {
      if (on) {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } else if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && jobRunning) keepAwake(true);   // 돌아오면 다시 켜두기
    if (!document.hidden && !jobRunning) document.title = '대신봐쫑';
  });

  // 완료 알림 허락 받기 (버튼 누를 때 한 번만 물어봄)
  function askNotifyPermission() {
    try {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    } catch (e) {}
  }

  async function notifyDone(ok, text) {
    document.title = ok ? '✅ 쫑이가 다 봤어요!' : '⚠️ 쫑이가 멈췄어요';
    try { if (navigator.vibrate) navigator.vibrate(ok ? [200, 100, 200] : [500]); } catch (e) {}
    if (!('Notification' in window) || Notification.permission !== 'granted' || !('serviceWorker' in navigator)) return;
    try {
      const reg = await Promise.race([navigator.serviceWorker.ready, sleep(3000).then(() => null)]);
      if (!reg) return;
      await reg.showNotification(ok ? '🐶 쫑이가 다 봤어요!' : '🐶 쫑이가 멈췄어요', {
        body: text,
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'jjongi',
        renotify: true,
        vibrate: [200, 100, 200]
      });
    } catch (e) {}
  }

  /* ---------- 유튜브 링크 / 시간 ---------- */

  function videoIdOf(raw) {
    const m = String(raw).trim().match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const pad = n => String(n).padStart(2, '0');
    return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }

  function toSec(ts) {
    if (!/^\d{1,2}(:\d{1,2}){0,2}$/.test(str(ts))) return null;
    return str(ts).split(':').reduce((t, p) => t * 60 + Number(p), 0);
  }

  // 구간 나누기 (+ 앞 구간과 20초 겹치기)
  //  coreStart~coreEnd: 이 쫑이가 맡은 범위 / start~end: 실제로 보는 범위
  function makeChunks(total) {
    const n = Math.min(MAX_CHUNKS, Math.max(2, Math.ceil(total / CHUNK_TARGET_SEC)));
    const len = Math.ceil(total / n);
    const out = [];
    for (let i = 0; i < n; i++) {
      const coreStart = i * len, coreEnd = Math.min(total, (i + 1) * len);
      if (coreEnd - coreStart <= 5) continue;
      out.push({ coreStart, coreEnd, start: Math.max(0, coreStart - OVERLAP_SEC), end: coreEnd });
    }
    return out;
  }

  }

  const hideModel = (k, v) => k === '__model' ? undefined : v;
  const REPORT_SPEC = '"fixes": 고친 곳 수(숫자), "report": {"fixed": ["무엇을 어떻게 고쳤는지 짧게"], "removed": ["영상에서 확인되지 않아 뺀 내용 짧게"], "unsure": ["끝까지 확실하지 않은 내용 짧게"]}';

  // 교차 검증: 다른 모델이 깐깐한 팩트체커가 되어 대조
  function verifyPrompt(json, rangeText) {
    return [
      '아래 JSON은 첨부된 영상' + (rangeText ? '(' + rangeText + ')' : '') + '을 다른 AI가 정리한 요약이다.',
      '너는 깐깐한 팩트체커다. 영상과 하나하나 대조해서 검증하라.',
      '- 영상과 다른 내용은 고친다. 영상에 없는 내용(지어낸 내용, 배경지식, 추측)은 지운다.',
      '- 빠진 중요한 내용이 있으면 추가한다.',
      '- 각 내용의 t가 실제로 그 내용이 나온 시각인지, quote가 영상 속 실제 말·글자와 같은지 확인하고 틀리면 고친다.',
      '- 숫자·이름·용어·표와 그래프 수치를 다시 확인한다. 끝까지 확실하지 않으면 끝에 "' + UNSURE + '"를 붙인다(확실해졌으면 뗀다).',
      '- 형식(키 이름, 구조)은 그대로 유지하고, 맨 바깥에 ' + REPORT_SPEC + '를 추가한다.',
      '- 문장은 짧은 개조식(~함/~임) 유지.',
      '', 'JSON으로만 답하라(다른 글 없이).',
      '', JSON.stringify(json, hideModel)
    ].join('\n');
  }

  // 초정밀: 서로 다른 모델이 따로 만든 요약 두 개를 영상으로 대조해 합치기
  function reconcilePrompt(a, b, rangeText) {
    return [
      '아래 A와 B는 첨부된 영상' + (rangeText ? '(' + rangeText + ')' : '') + '을 서로 다른 AI가 따로따로 정리한 요약이다.',
      '영상을 보며 둘을 대조해서 하나의 정확한 요약을 만들어라.',
      '- A와 B에 모두 있는 내용은 유지한다.',
      '- 한쪽에만 있는 내용은 영상에서 확인되면 유지하고, 확인되지 않으면 지운다.',
      '- A와 B가 서로 다르게 말하면 영상 기준으로 고친다.',
      '- 각 내용의 t와 quote가 영상과 맞는지 확인한다. 끝까지 확실하지 않으면 끝에 "' + UNSURE + '"를 붙인다.',
      '- 형식은 A와 똑같이 하고, 맨 바깥에 ' + REPORT_SPEC + '를 추가한다. (fixed에는 A·B가 달랐던 점과 결정 이유를 짧게)',
      '', 'JSON으로만 답하라(다른 글 없이).',
      '', 'A:', JSON.stringify(a, hideModel), '', 'B:', JSON.stringify(b, hideModel)
    ].join('\n');
  }

  function mergePrompt(detail, mode, sections, videoVisuals, info) {
    const n = (AMOUNT[detail] || AMOUNT.normal).take;
    const visual = mode !== 'text';
    const text = sections.map(s => '[' + s.timestamp + '] ' + s.heading + '\n' +
      s.points.map(p => '- ' + p.text + (p.t ? ' (근거 ' + p.t + ')' : '')).join('\n')).join('\n\n');
    const vtitles = videoVisuals.map(v => '- [' + v.timestamp + '] ' + v.title).join('\n');
    return [
      '아래는 유튜브 영상' + (info && info.title ? ' "' + info.title + '"' : '') + '의 구간별 정리다. 이것만 근거로 답하라.',
      '- 새로운 내용을 지어내지 말고 아래에 있는 내용만 쓴다. "~함/~임" 개조식.',
      '- "' + UNSURE + '"가 붙은 내용을 쓸 때는 그 표시도 그대로 둔다.',
      '- oneLine: 영상 전체 한 줄 결론. keyTakeaways: 가장 중요한 포인트 ' + n + '개, 각각 t에는 아래 "(근거 시각)" 중 해당하는 것을 그대로 쓴다.',
      '- title: ' + (info && info.title ? '"' + info.title + '" 그대로.' : '내용을 나타내는 짧은 제목.'),
      visual ? illustrationRule(mode) : '',
      '', '아래 JSON 형식으로만 답하라:',
      '{"title": "", "oneLine": "", ' + TAKEAWAYS_SPEC + (visual ? ',\n' + ILLUSTRATIONS_SPEC : '') + '}',
      '', '--- 구간별 정리 ---', text,
      vtitles ? '\n--- 화면에 나온 자료 ---\n' + vtitles : ''
    ].filter(x => x !== '').join('\n');
  }

  /* ---------- Gemini 호출 ---------- */

  // req = { prompt, videoUrl?, start?, end? }
  async function callGemini(model, req, opt) {
    const parts = [];
    if (req.videoUrl) {
      const vp = { file_data: { file_uri: req.videoUrl } };
      const meta = {};
      if (opt.fps) meta.fps = opt.fps;
      if (req.start != null) { meta.start_offset = Math.floor(req.start) + 's'; meta.end_offset = Math.ceil(req.end) + 's'; }
      if (Object.keys(meta).length) vp.video_metadata = meta;
      parts.push(vp);
    }
    parts.push({ text: req.prompt });

    const body = { contents: [{ parts }], generationConfig: { responseMimeType: 'application/json' } };
    if (req.videoUrl && opt.lowres) body.generationConfig.mediaResolution = 'MEDIA_RESOLUTION_LOW';
    if (opt.thinking) body.generationConfig.thinkingConfig = { thinkingLevel: opt.thinking };

    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15 * 60 * 1000);
    try {
      const res = await fetch(API_BASE + model + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': API_KEY },
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const e = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
        e.status = res.status;
        throw e;
      }
      const cand = data.candidates && data.candidates[0];
      if (!cand || !cand.content || !cand.content.parts) {
        const why = (data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || '응답 없음';
        throw new Error('영상을 처리하지 못했습니다 (' + why + ')');
      }
      return parseJson(cand.content.parts.filter(p => p.text && !p.thought).map(p => p.text).join(''));
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('15분이 지나도 응답이 없어 중단했습니다. 다시 시도해 주세요.');
      throw e;
    } finally {
      clearTimeout(t);
    }
  }

  function parseJson(text) {
    const s = String(text).trim().replace(/^`{3}(?:json)?\s*/i, '').replace(/`{3}\s*$/, '');
    try { return JSON.parse(s); } catch (e) {}
    const a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) {} }
    throw new Error('요약 결과를 읽지 못했습니다. 다시 시도해 주세요.');
  }

  // 모델이 특정 설정을 거부(400)하면 그 설정만 빼고 다시 시도
  function dropRejectedOption(e, opt) {
    if (e.status !== 400) return false;
    const m = e.message || '';
    if (opt.fps && /fps|video_?metadata|videoMetadata/i.test(m)) { opt.fps = null; return true; }
    if (opt.thinking && /think/i.test(m)) { opt.thinking = null; return true; }
    if (opt.lowres && /media_?resolution|mediaResolution/i.test(m)) { opt.lowres = false; return true; }
    return false;
  }

  // 모델 순서대로 시도 + 거부된 설정 빼고 재시도
  async function ask(req, speed, models) {
    let lastErr;
    for (const model of (models || MODELS)) {
      const opt = Object.assign({}, SPEED[speed] || SPEED.fast);
      let tries = 0, netTries = 0;
      while (tries < 4) {
        try {
          const r = await callGemini(model, req, opt);
          if (r && typeof r === 'object') r.__model = model;  // 실제로 답한 모델 기록
          return r;
        } catch (e) {
          lastErr = e;
          // 다른 앱 갔다 와서 끊긴 거면: 돌아올 때까지 기다렸다가 같은 요청 다시 (끝난 부분은 그대로)
          if (isNetErr(e) && netTries < 4) { netTries++; await pauseUntilBack(); continue; }
          tries++;
          if (dropRejectedOption(e, opt)) continue;
          break;
        }
      }
      if (![404, 429, 500, 503].includes(lastErr && lastErr.status)) break;
    }
    throw lastErr;
  }

  /* ---------- 환각 막기: 교차 검증 / 초정밀 ---------- */

  // 요약과 '다른' 모델이 먼저 검증하도록 순서를 바꿔 둠 (같은 모델은 같은 실수를 놓치기 쉬움)
  const CHECK_MODELS = ['gemini-3.7-flash', 'gemini-3.8-flash', 'gemini-3.5-flash-lite'];
  const CHECK_METHOD = {
    off: '검증 생략 (빠르게)',
    on: '다른 AI 모델이 영상과 다시 대조 (교차 검증)',
    ultra: '서로 다른 AI 두 개가 따로 요약 → 영상으로 비교·대조 (초정밀)'
  };
  const num = v => Math.max(0, Number(v) || 0);
  const keepSections = (v, orig) => {
    if (!v || typeof v !== 'object') return orig;
    if (arr(orig.sections).length && !arr(v.sections).length) v.sections = orig.sections;
    return v;
  };

  async function crossCheck(req, json, speed, onStage) {
    onStage && onStage('verify');
    try {
      const v = await ask(Object.assign({}, req, { prompt: verifyPrompt(json, req.rangeText) }), speed, CHECK_MODELS);
      return { data: keepSections(v, json), check: { ok: true, fixes: num(v.fixes), report: v.report, src: [json.__model], by: v.__model } };
    } catch (e) {
      return { data: json, check: { ok: false, src: [json.__model] } };
    }
  }

  // 요약 하나 만들기 (+ 검증 방식에 따라 교차 검증 또는 초정밀)
  async function produce(req, prompt, opts, onStage) {
    const base = Object.assign({}, req, { prompt });
    if (opts.check === 'ultra') {
      onStage && onStage('double');
      const [a, b] = await Promise.allSettled([ask(base, opts.speed, MODELS), ask(base, opts.speed, CHECK_MODELS)]);
      const A = a.status === 'fulfilled' ? a.value : null;
      const B = b.status === 'fulfilled' ? b.value : null;
      if (!A && !B) throw a.reason || b.reason;
      if (A && B) {
        onStage && onStage('reconcile');
        try {
          const v = await ask(Object.assign({}, req, { prompt: reconcilePrompt(A, B, req.rangeText) }), opts.speed, MODELS);
          return { data: keepSections(v, A), check: { ok: true, fixes: num(v.fixes), report: v.report, src: [A.__model, B.__model], by: v.__model } };
        } catch (e) {
          return await crossCheck(req, A, opts.speed, onStage);
        }
      }
      return await crossCheck(req, A || B, opts.speed, onStage);
    }
    const first = await ask(base, opts.speed, MODELS);
    if (opts.check === 'off') return { data: first, check: { ok: false, src: [first.__model] } };
    return await crossCheck(req, first, opts.speed, onStage);
  }

  function newReport(check) {
    return { kind: check, method: CHECK_METHOD[check] || CHECK_METHOD.on, checked: 0, fixes: 0, fixed: [], removed: [], unsure: [], auto: null, sumModels: [], checkModels: [] };
  }
  function addReport(R, chk) {
    if (!chk) return;
    (chk.src || []).forEach(m => { if (m && !R.sumModels.includes(m)) R.sumModels.push(m); });
    if (chk.ok && chk.by && !R.checkModels.includes(chk.by)) R.checkModels.push(chk.by);
    if (!chk.ok) return;
    R.checked++;
    R.fixes += num(chk.fixes);
    const r = chk.report || {};
    ['fixed', 'removed', 'unsure'].forEach(k => { R[k] = R[k].concat(arr(r[k]).map(str).filter(Boolean)); });
  }
  function trimReport(R) {
    ['fixed', 'removed', 'unsure'].forEach(k => { R[k] = Array.from(new Set(R[k])).slice(0, 12); });
    // 실제로 일한 모델을 검증 방식에 그대로 적기 (PDF에도 그대로 들어감)
    if (R.sumModels.length) {
      let line = ' — 요약: ' + R.sumModels.join(', ');
      if (R.checkModels.length) {
        line += ' / 검증: ' + R.checkModels.join(', ');
        if (R.kind === 'on' && R.checkModels.every(m => R.sumModels.includes(m))) {
          line += ' (검증용 모델이 바빠서 같은 모델로 검증했어요)';
        }
      } else if (R.kind !== 'off') {
        line += ' / 검증 실패(바쁨) → 검증 없이 진행';
      }
      R.method += line;
    }
    return R;
  }

  // 코드가 직접 하는 점검: 근거 시각 없는 문장, 인용 없는 숫자·이름, 영상 길이 밖 시각 → (확인 필요)
  function audit(s, total) {
    const a = { noEvidence: 0, numberNoQuote: 0, outOfRange: 0 };
    const flag = x => { if (!x.text.includes(UNSURE)) x.text += ' ' + UNSURE; };
    const checkT = x => {
      if (!x.t) { a.noEvidence++; flag(x); return; }
      const sec = toSec(x.t);
      if (total && sec != null && sec > total + 5) { a.outOfRange++; x.t = ''; flag(x); }
    };
    s.sections.forEach(sec => sec.points.forEach(p => {
      checkT(p);
      if (/\d/.test(p.text.split(UNSURE).join('')) && !p.quote) { a.numberNoQuote++; flag(p); }
    }));
    s.keyTakeaways.forEach(checkT);
    return a;
  }

  /* ---------- 결과 다듬기 ---------- */

  function normPoint(p, fixT) {
    if (p == null) return null;
    if (typeof p !== 'object') p = { text: p };
    const text = str(p.text);
    if (!text) return null;
    const sec = toSec(p.t);
    return { text, t: sec == null ? '' : fmtTime(fixT ? fixT(sec) : sec), quote: str(p.quote) };
  }

  function cleanSection(s, fixT) {
    if (!s) return null;
    const raw = toSec(s.timestamp);
    const sec = fixT ? fixT(raw) : (raw == null ? 0 : raw);
    return { _t: sec, timestamp: fmtTime(sec), heading: str(s.heading), points: arr(s.points).map(p => normPoint(p, fixT)).filter(Boolean) };
  }

  function cleanBlock(b, fixTime) {
    if (!b || typeof b !== 'object') return null;
    const type = str(b.type);
    const out = { type, title: str(b.title) };
    if (fixTime && b.timestamp != null) {
      const sec = fixTime(toSec(b.timestamp));
      out._t = sec; out.timestamp = fmtTime(sec);
    }
    if (type === 'table') {
      out.headers = arr(b.headers).map(str);
      out.rows = arr(b.rows).filter(Array.isArray).map(r => r.map(str));
      if (!out.rows.length) return null;
    } else if (type === 'chart') {
      out.chartType = ['bar', 'line', 'pie'].includes(str(b.chartType)) ? str(b.chartType) : 'bar';
      out.labels = arr(b.labels).map(str);
      out.unit = str(b.unit);
      out.series = arr(b.series).filter(x => x && Array.isArray(x.values)).map(x => ({
        name: str(x.name),
        values: x.values.map(v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : null; })
      }));
      if (!out.labels.length || !out.series.length) return null;
    } else if (type === 'figure') {
      out.description = str(b.description);
      if (!out.description) return null;
    } else if (type === 'flow') {
      out.steps = arr(b.steps).filter(Boolean).map(s => ({ title: str(s.title), desc: str(s.desc) })).filter(s => s.title || s.desc);
      if (!out.steps.length) return null;
    } else if (type === 'mindmap') {
      out.center = str(b.center) || out.title;
      out.branches = arr(b.branches).filter(Boolean).map(x => ({ label: str(x.label), items: arr(x.items).map(str).filter(Boolean) })).filter(x => x.label);
      if (!out.branches.length) return null;
    } else if (type === 'numbers') {
      out.items = arr(b.items).filter(Boolean).map(x => ({ value: str(x.value), label: str(x.label) })).filter(x => x.value);
      if (!out.items.length) return null;
    } else {
      return null;
    }
    return out;
  }

  const byTime = (a, b) => (a._t || 0) - (b._t || 0);
  const dropT = o => { delete o._t; return o; };

  /* ---------- 요약 전체 흐름 ---------- */

  async function summarizeWhole(videoUrl, opts, info) {
    if (cloneMode !== 'roles') showRoleClones();
    updateMsg('쫑이 분신술! 펑! 🐶×5\n1호가 영상 보고, 나머지는 각자 맡은 일 하는 중');
    const R = newReport(opts.check);
    const out = await produce({ videoUrl, rangeText: '영상 전체' }, wholePrompt(opts.detail, opts.mode, info), opts, stage => {
      if (stage === 'double') { cloneState(0, 'double'); updateMsg('초정밀 모드! 서로 다른 AI 두 개가 따로따로 보는 중 👀👀'); }
      if (stage === 'verify') { cloneState(0, 'verify'); updateMsg('1호가 다 봤음! 이제 다른 AI가 영상이랑 하나하나 대조하는 중 🔍'); }
      if (stage === 'reconcile') { cloneState(0, 'verify'); updateMsg('두 요약을 영상으로 비교하는 중… 둘 다 맞는 것만 남김 ⚖️'); }
    });
    addReport(R, out.check);
    const r = out.data;
    const fx = t => t == null ? 0 : t;
    return {
      title: (info && info.title) || str(r.title),
      channel: (info && info.channel) || str(r.channel),
      oneLine: str(r.oneLine),
      keyTakeaways: arr(r.keyTakeaways).map(k => normPoint(k, null)).filter(Boolean),
      sections: arr(r.sections).map(s => cleanSection(s, fx)).filter(Boolean).sort(byTime).map(dropT),
      illustrations: arr(r.illustrations).map(b => cleanBlock(b, null)).filter(Boolean),
      videoVisuals: arr(r.videoVisuals).map(b => cleanBlock(b, fx)).filter(Boolean).sort(byTime).map(dropT),
      visualNotes: arr(r.visualNotes).map(str).filter(Boolean),
      check: { done: R.checked > 0, fixes: R.fixes },
      factCheck: trimReport(R)
    };
  }

  // 쫑이 분신술: 구간을 나눠 동시에 보고(+각자 검증), 마지막에 합침
  async function summarizeSplit(videoUrl, opts, info) {
    const chunks = makeChunks(info.seconds);
    let done = 0;
    const show = () => updateMsg('쫑이 분신술! 펑! 🐶×' + chunks.length + '\n쫑이 ' + chunks.length + '마리가 나눠서 보는 중 (' + done + '/' + chunks.length + ' 완료)');
    showClones(chunks);
    show();

    const R = newReport(opts.check);
    const results = await Promise.all(chunks.map(async (c, i) => {
      const req = { videoUrl, start: c.start, end: c.end, rangeText: fmtTime(c.coreStart) + '~' + fmtTime(c.coreEnd) + ' 구간' };
      const out = await produce(req, chunkPrompt(opts.detail, opts.mode, c, info), opts,
        stage => cloneState(i, stage === 'double' ? 'double' : 'verify'));
      done++; cloneState(i, 'done'); show();
      return { c, r: out.data, check: out.check };
    }));

    // 시각 보정: 구간 기준으로 나왔으면 원본 기준으로, 겹치는 부분은 맡은 범위 시작으로
    const fixFor = c => t => {
      if (t == null) return c.coreStart;
      if (c.start > 0 && t < c.start - 20) t += c.start;
      return Math.min(Math.max(t, c.coreStart), c.coreEnd);
    };

    let sections = [], videoVisuals = [], visualNotes = [];
    results.forEach(({ c, r, check }) => {
      const fx = fixFor(c);
      arr(r.sections).forEach(s => { const x = cleanSection(s, fx); if (x) sections.push(x); });
      arr(r.videoVisuals).forEach(b => { const x = cleanBlock(b, fx); if (x) videoVisuals.push(x); });
      visualNotes = visualNotes.concat(arr(r.visualNotes).map(str).filter(Boolean));
      addReport(R, check);
    });
    sections.sort(byTime);
    const seen = new Set();
    videoVisuals = videoVisuals.sort(byTime).filter(v => {
      const k = v.type + '|' + v.title.replace(/\s+/g, '');
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    if (!sections.length) throw new Error('구간 요약이 비어 있습니다. 다시 시도해 주세요.');

    clonesMerge();
    updateMsg(opts.mode === 'text' ? '쫑이들 합체 중! 본 내용 하나로 모으는 중 🌀' : '쫑이들 합체 중! 내용 모아서 그림으로 정리하는 중 🌀🖍️');
    const top = await ask({ prompt: mergePrompt(opts.detail, opts.mode, sections, videoVisuals, info) }, opts.speed);

    return {
      title: (info && info.title) || str(top.title),
      channel: (info && info.channel) || '',
      oneLine: str(top.oneLine),
      keyTakeaways: arr(top.keyTakeaways).map(k => normPoint(k, null)).filter(Boolean),
      sections: sections.map(dropT),
      illustrations: arr(top.illustrations).map(b => cleanBlock(b, null)).filter(Boolean),
      videoVisuals: videoVisuals.map(dropT),
      visualNotes,
      check: { done: R.checked > 0, fixes: R.fixes },
      factCheck: trimReport(R)
    };
  }

  async function summarize(videoUrl, opts, info) {
    if (info && info.seconds >= SPLIT_MIN_SEC) {
      try {
        return await summarizeSplit(videoUrl, opts, info);
      } catch (e) {
        // 구간 자르기를 모델이 거부하면(400) 한 번에 보는 방식으로
        if (e.status !== 400) throw e;
        showRoleClones();
      }
    }
    return await summarizeWhole(videoUrl, opts, info);
  }

  function friendlyError(e) {
    const m = (e && e.message) || String(e);
    if (/PASSWORD/.test(m)) { forgetPw(); return '암호가 바뀐 것 같아요 🔒 화면을 새로고침하고 새 암호를 넣어 주세요.'; }
    if (/API key|API_KEY_INVALID/i.test(m)) return 'API 키 문제입니다. 스크립트 속성의 GEMINI_API_KEY를 확인하세요.\n(' + m + ')';
    if (e && e.status === 429) return '오늘 쫑이 체력 끝남 😴 (무료 사용량 한도)\n잠시 후, 아니면 내일 다시 해 줘.\n("얼마나 깐깐하게"를 확인 생략으로 바꾸면 덜 지쳐요)\n(' + m + ')';
    if (/too long|exceeds|token count|maximum number of tokens/i.test(m)) return '영상이 너무 길어서 쫑이가 지침 😵 "2배속처럼 빠르게"로 다시 해 줘.\n(' + m + ')';
    if (/서버 응답이 없습니다|15분/.test(m)) return m;
    if (/Failed to fetch|NetworkError/i.test(m)) return '인터넷 연결이 끊긴 것 같아요. 잠시 후 다시 해 줘.\n(' + m + ')';
    return '쫑이가 이 영상은 못 보겠대 🥲\n오류: ' + m + '\n\n· 공개 영상인지 확인해 줘 (비공개·일부 공개 영상은 안 됨)\n· 연령 제한 영상은 실패할 수 있어요';
  }

  /* =====================================================================
     쫑이 그림 그리기 (SVG) → 화면에 바로 보여주고, PNG로 바꿔서 PDF에 넣음
     ===================================================================== */

  const W = 400, PAD = 16;   // 휴대폰에서 글씨가 작아지지 않게 좁게 그림
  const FONT = '-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
  const C = { ink: '#2b2118', sub: '#7a6552', orange: '#ff7a2f', cream: '#fff8ee', line: '#e3d5c3', card: '#ffffff', warn: '#9a5b00' };
  const PALETTE = ['#ff7a2f', '#4a90e2', '#2fb36b', '#9b59b6', '#e5b33d', '#e2557a'];

  const measureCtx = document.createElement('canvas').getContext('2d');
  function textW(t, size, weight) {
    measureCtx.font = (weight || 400) + ' ' + size + 'px ' + FONT;
    return measureCtx.measureText(t).width;
  }
  // 줄바꿈 (한글은 글자 단위로도 끊음)
  function wrap(text, size, weight, maxW, maxLines) {
    text = str(text);
    if (!text) return [];
    const words = text.split(/(\s+)/);
    const lines = [];
    let line = '';
    const push = l => { if (l.trim()) lines.push(l.trim()); };
    for (const w of words) {
      if (textW(line + w, size, weight) <= maxW) { line += w; continue; }
      if (line.trim()) { push(line); line = ''; }
      if (/^\s+$/.test(w)) continue;
      if (textW(w, size, weight) <= maxW) { line = w; continue; }
      for (const ch of w) {
        if (textW(line + ch, size, weight) > maxW) { push(line); line = ''; }
        line += ch;
      }
    }
    push(line);
    if (maxLines && lines.length > maxLines) {
      const cut = lines.slice(0, maxLines);
      let last = cut[maxLines - 1];
      while (last.length && textW(last + '…', size, weight) > maxW) last = last.slice(0, -1);
      cut[maxLines - 1] = last + '…';
      return cut;
    }
    return lines;
  }
  const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function txt(x, y, s, size, weight, fill, anchor) {
    const color = String(s).includes(UNSURE) ? C.warn : (fill || C.ink);
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + (weight || 400) + '" fill="' + color +
      '" font-family=\'' + FONT + '\'' + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + xmlEsc(s) + '</text>';
  }
  function lines(x, y, arrLines, size, weight, fill, lh, anchor) {
    return arrLines.map((l, i) => txt(x, y + i * lh, l, size, weight, fill, anchor)).join('');
  }
  function frame(inner, h, title, tag) {
    let head = '';
    let top = PAD;
    if (title || tag) {
      const tl = wrap(title || '', 18, 800, W - PAD * 2 - (tag ? 130 : 0), 2);
      head += lines(PAD, PAD + 20, tl, 18, 800, C.ink, 24);
      if (tag) {
        const tw = textW(tag, 11, 700) + 18;
        head += '<rect x="' + (W - PAD - tw) + '" y="' + (PAD + 4) + '" width="' + tw + '" height="20" rx="10" fill="#ffe9d9"/>' +
          txt(W - PAD - tw / 2, PAD + 18, tag, 11, 700, C.orange, 'middle');
      }
      top = PAD + Math.max(1, tl.length) * 24 + 14;
    }
    const total = top + h + PAD;
    return {
      svg: '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + total + '" viewBox="0 0 ' + W + ' ' + total + '">' +
        '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (total - 2) + '" rx="18" fill="' + C.cream + '" stroke="' + C.line + '" stroke-width="2"/>' +
        head + '<g transform="translate(0,' + top + ')">' + inner + '</g></svg>',
      w: W, h: total
    };
  }

  // 1) 숫자 카드
  function drawNumbers(b, tag) {
    const items = b.items.slice(0, 6);
    const cols = items.length <= 3 ? items.length : (items.length === 4 ? 2 : 3);
    const gap = 12, cw = (W - PAD * 2 - gap * (cols - 1)) / cols;
    let y = 0, out = '';
    for (let r = 0; r < items.length; r += cols) {
      const row = items.slice(r, r + cols);
      const cells = row.map(it => {
        let size = 30;
        while (size > 16 && textW(it.value, size, 800) > cw - 24) size -= 2;
        const vl = wrap(it.value, size, 800, cw - 24, 2);
        const ll = wrap(it.label, 13, 500, cw - 24, 3);
        return { vl, ll, size, h: 18 + vl.length * (size + 4) + 6 + ll.length * 18 + 14 };
      });
      const rh = Math.max(...cells.map(c => c.h));
      cells.forEach((c, i) => {
        const x = PAD + i * (cw + gap);
        out += '<rect x="' + x + '" y="' + y + '" width="' + cw + '" height="' + rh + '" rx="14" fill="' + C.card + '" stroke="' + C.line + '"/>';
        out += lines(x + cw / 2, y + 14 + c.size, c.vl, c.size, 800, C.orange, c.size + 4, 'middle');
        out += lines(x + cw / 2, y + 18 + c.vl.length * (c.size + 4) + 14, c.ll, 13, 500, C.sub, 18, 'middle');
      });
      y += rh + gap;
    }
    return frame(out, y - gap, b.title, tag);
  }

  // 2) 단계 흐름도
  function drawFlow(b, tag) {
    const steps = b.steps.slice(0, 8);
    let y = 0, out = '';
    const tx = PAD + 52, tw = W - tx - PAD - 14;
    steps.forEach((s, i) => {
      const tl = wrap(s.title, 15, 800, tw, 2);
      const dl = wrap(s.desc, 13, 400, tw, 3);
      const h = 14 + tl.length * 20 + (dl.length ? 4 + dl.length * 18 : 0) + 12;
      out += '<rect x="' + PAD + '" y="' + y + '" width="' + (W - PAD * 2) + '" height="' + h + '" rx="14" fill="' + C.card + '" stroke="' + C.line + '"/>';
      out += '<circle cx="' + (PAD + 26) + '" cy="' + (y + h / 2) + '" r="15" fill="' + C.orange + '"/>' +
        txt(PAD + 26, y + h / 2 + 5, String(i + 1), 14, 800, '#fff', 'middle');
      out += lines(tx, y + 14 + 15, tl, 15, 800, C.ink, 20);
      out += lines(tx, y + 14 + tl.length * 20 + 4 + 13, dl, 13, 400, C.sub, 18);
      y += h;
      if (i < steps.length - 1) {
        const cx = PAD + 26;
        out += '<path d="M' + (cx - 7) + ' ' + (y + 5) + ' L' + (cx + 7) + ' ' + (y + 5) + ' L' + cx + ' ' + (y + 15) + ' Z" fill="' + C.orange + '"/>';
        y += 20;
      }
    });
    return frame(out, y, b.title, tag);
  }

  // 3) 개념도 (가운데 주제 → 기둥선 → 가지 카드)
  function drawMindmap(b, tag) {
    const br = b.branches.slice(0, 6);
    const cl = wrap(b.center, 16, 800, W - PAD * 2 - 40, 2);
    const cw0 = Math.min(W - PAD * 2, Math.max(...cl.map(l => textW(l, 16, 800))) + 40);
    const ch0 = 18 + cl.length * 21;
    const cols = br.length === 1 ? 1 : 2, gap = 22;
    const cw = (W - PAD * 2 - gap * (cols - 1)) / cols;
    const cards = br.map(x => {
      const ll = wrap(x.label, 14, 800, cw - 28, 2);
      const items = x.items.slice(0, 5).map(it => wrap(it, 13, 400, cw - 38, 3));
      const h = 12 + ll.length * 19 + 6 + items.reduce((a2, l) => a2 + l.length * 17 + 4, 0) + 8;
      return { ll, items, h };
    });
    let y = ch0 + 24, wires = '', boxes = '', lastMid = y;
    for (let r = 0; r < cards.length; r += cols) {
      const row = cards.slice(r, r + cols);
      const rh = Math.max(...row.map(c => c.h));
      row.forEach((c, i) => {
        const x = PAD + i * (cw + gap);
        const color = PALETTE[(r + i) % PALETTE.length];
        const my = y + 20;
        if (cols === 2) {
          const edge = i === 0 ? x + cw : x;
          wires += '<line x1="' + (W / 2) + '" y1="' + my + '" x2="' + edge + '" y2="' + my + '" stroke="' + C.orange + '" stroke-width="2" opacity=".6"/>' +
            '<circle cx="' + (W / 2) + '" cy="' + my + '" r="3.5" fill="' + C.orange + '"/>';
          lastMid = my;
        } else {
          wires += '<line x1="' + (W / 2) + '" y1="' + ch0 + '" x2="' + (W / 2) + '" y2="' + y + '" stroke="' + C.orange + '" stroke-width="2" opacity=".6"/>';
        }
        boxes += '<rect x="' + x + '" y="' + y + '" width="' + cw + '" height="' + rh + '" rx="12" fill="' + C.card + '" stroke="' + C.line + '"/>' +
          '<rect x="' + x + '" y="' + (y + 10) + '" width="5" height="' + (c.ll.length * 19 + 4) + '" rx="2.5" fill="' + color + '"/>';
        boxes += lines(x + 14, y + 12 + 14, c.ll, 14, 800, C.ink, 19);
        let iy = y + 12 + c.ll.length * 19 + 6;
        c.items.forEach(l => {
          boxes += '<circle cx="' + (x + 19) + '" cy="' + (iy + 8) + '" r="2.5" fill="' + C.sub + '"/>';
          boxes += lines(x + 28, iy + 12, l, 13, 400, C.sub, 17);
          iy += l.length * 17 + 4;
        });
      });
      y += rh + 12;
    }
    if (cols === 2) {
      wires = '<line x1="' + (W / 2) + '" y1="' + ch0 + '" x2="' + (W / 2) + '" y2="' + lastMid + '" stroke="' + C.orange + '" stroke-width="2" opacity=".6"/>' + wires;
    }
    const center = '<rect x="' + (W / 2 - cw0 / 2) + '" y="0" width="' + cw0 + '" height="' + ch0 + '" rx="' + Math.min(22, ch0 / 2) + '" fill="' + C.orange + '"/>' +
      lines(W / 2, 9 + 16, cl, 16, 800, '#fff', 21, 'middle');
    return frame(wires + boxes + center, y - 12, b.title, tag);
  }

  // 4) 그래프 (막대·선·원)
  function drawChart(b, tag) {
    const labels = b.labels.slice(0, 12);
    const series = b.series.slice(0, 5);
    let out = '';
    if (b.chartType === 'pie' && series.length >= 1) {
      const vals = labels.map((_, i) => Math.max(0, series[0].values[i] || 0));
      const sum = vals.reduce((a, v) => a + v, 0) || 1;
      const R = 72, cx = PAD + R + 6, cy = R + 10;
      let ang = -Math.PI / 2;
      vals.forEach((v, i) => {
        const a2 = ang + (v / sum) * Math.PI * 2;
        const large = a2 - ang > Math.PI ? 1 : 0;
        const p = (a) => (cx + R * Math.cos(a)).toFixed(1) + ' ' + (cy + R * Math.sin(a)).toFixed(1);
        if (v / sum >= 0.999) out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="' + PALETTE[i % PALETTE.length] + '"/>';
        else if (v > 0) out += '<path d="M' + cx + ' ' + cy + ' L' + p(ang) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(a2) + ' Z" fill="' + PALETTE[i % PALETTE.length] + '" stroke="#fff" stroke-width="2"/>';
        ang = a2;
      });
      let ly = 20;
      const lx = cx + R + 30;
      labels.forEach((l, i) => {
        const pct = Math.round(vals[i] / sum * 1000) / 10;
        out += '<rect x="' + lx + '" y="' + (ly - 11) + '" width="12" height="12" rx="3" fill="' + PALETTE[i % PALETTE.length] + '"/>';
        out += txt(lx + 20, ly, wrap(l, 13, 600, W - lx - 20 - PAD, 1)[0] || '', 13, 600, C.ink);
        out += txt(lx + 20, ly + 16, (b.unit === '%' ? pct + '%' : (series[0].values[i] == null ? '?' : series[0].values[i]) + (b.unit || '') + ' (' + pct + '%)'), 12, 700, C.sub);
        ly += 40;
      });
      return frame(out, Math.max(cy + R + 10, ly), b.title, tag);
    }

    const all = series.flatMap(s => s.values).filter(v => v != null);
    if (!all.length) return null;
    let max = Math.max(...all, 0), min = Math.min(...all, 0);
    if (max === min) max = min + 1;
    const nice = (v) => { const p = Math.pow(10, Math.floor(Math.log10(Math.abs(v) || 1))); return Math.ceil(v / p) * p; };
    max = max > 0 ? nice(max) : 0;
    const x0 = PAD + 36, x1 = W - PAD, plotH = 200, top = (series.length > 1 || b.unit) ? 34 : 14;
    const yOf = v => top + plotH - (v - min) / (max - min) * plotH;
    if (b.unit) out += txt(PAD, top - 20, '단위: ' + b.unit, 11, 600, C.sub);
    if (series.length > 1) {
      let lx = W - PAD;
      series.slice().reverse().forEach((s, ri) => {
        const i = series.length - 1 - ri;
        const t = s.name || ('계열' + (i + 1));
        const w = textW(t, 12, 600) + 22;
        lx -= w;
        out += '<rect x="' + lx + '" y="' + (top - 22) + '" width="12" height="12" rx="3" fill="' + PALETTE[i % PALETTE.length] + '"/>' + txt(lx + 16, top - 12, t, 12, 600, C.ink);
        lx -= 8;
      });
    }
    for (let g = 0; g <= 4; g++) {
      const v = min + (max - min) * g / 4;
      const y = yOf(v);
      out += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="' + C.line + '" stroke-width="1"/>';
      out += txt(x0 - 6, y + 4, String(Math.round(v * 100) / 100), 11, 400, C.sub, 'end');
    }
    const gw = (x1 - x0) / labels.length;
    if (b.chartType === 'line') {
      series.forEach((s, si) => {
        const pts = labels.map((_, i) => s.values[i] == null ? null : [x0 + gw * (i + 0.5), yOf(s.values[i])]);
        const d = pts.filter(Boolean).map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
        out += '<path d="' + d + '" fill="none" stroke="' + PALETTE[si % PALETTE.length] + '" stroke-width="3" stroke-linejoin="round"/>';
        pts.forEach((p, i) => {
          if (!p) return;
          out += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" fill="#fff" stroke="' + PALETTE[si % PALETTE.length] + '" stroke-width="2.5"/>';
          if (series.length === 1) out += txt(p[0], p[1] - 10, String(s.values[i]), 11, 700, C.ink, 'middle');
        });
      });
    } else {
      const bw = Math.min(40, (gw - 12) / series.length);
      labels.forEach((_, i) => {
        series.forEach((s, si) => {
          const v = s.values[i];
          if (v == null) return;
          const x = x0 + gw * i + (gw - bw * series.length) / 2 + si * bw;
          const y = yOf(Math.max(v, 0)), y0 = yOf(Math.min(v, 0));
          out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw - 3).toFixed(1) + '" height="' + Math.max(1, y0 - y).toFixed(1) + '" rx="4" fill="' + PALETTE[si % PALETTE.length] + '"/>';
          out += txt(x + (bw - 3) / 2, y - 5, String(v), 10.5, 700, C.ink, 'middle');
        });
      });
    }
    let maxL = 1;
    labels.forEach((l, i) => {
      const ll = wrap(l, 11, 500, gw - 4, 2);
      maxL = Math.max(maxL, ll.length);
      out += lines(x0 + gw * (i + 0.5), top + plotH + 18, ll, 11, 500, C.sub, 14, 'middle');
    });
    return frame(out, top + plotH + 10 + maxL * 14, b.title, tag);
  }

  // 5) 핵심 포인트 카드 (그림 모드)
  function drawPoints(items, title) {
    let y = 0, out = '';
    const tw = W - PAD * 2 - 60;
    items.forEach((t, i) => {
      const tl = wrap(t, 15, 600, tw, 4);
      const h = 18 + tl.length * 21 + 8;
      out += '<rect x="' + PAD + '" y="' + y + '" width="' + (W - PAD * 2) + '" height="' + h + '" rx="14" fill="' + C.card + '" stroke="' + C.line + '"/>';
      out += '<rect x="' + (PAD + 14) + '" y="' + (y + h / 2 - 15) + '" width="30" height="30" rx="9" fill="' + PALETTE[i % PALETTE.length] + '"/>' +
        txt(PAD + 29, y + h / 2 + 5, String(i + 1), 14, 800, '#fff', 'middle');
      out += lines(PAD + 56, y + 18 + 14, tl, 15, 600, C.ink, 21);
      y += h + 10;
    });
    return frame(out, y - 10, title, '');
  }

  // 6) 영상 흐름 타임라인 (그림 모드)
  function drawTimeline(sections, title) {
    let y = 6, out = '';
    const lx = PAD + 70, tx = lx + 20, tw = W - tx - PAD;
    const rows = sections.map(s => {
      const hl2 = wrap(s.heading, 14, 700, tw, 2);
      const pl = s.points.length ? wrap(s.points[0].text || s.points[0], 12, 400, tw, 2) : [];
      return { s, hl2, pl, h: hl2.length * 19 + (pl.length ? 2 + pl.length * 16 : 0) + 18 };
    });
    const totalH = rows.reduce((a, r) => a + r.h, 0);
    out += '<line x1="' + lx + '" x2="' + lx + '" y1="' + 10 + '" y2="' + (totalH - 10) + '" stroke="' + C.line + '" stroke-width="3" stroke-linecap="round"/>';
    rows.forEach((r, i) => {
      out += txt(lx - 14, y + 14, r.s.timestamp, 13, 800, C.orange, 'end');
      out += '<circle cx="' + lx + '" cy="' + (y + 9) + '" r="7" fill="' + PALETTE[i % PALETTE.length] + '" stroke="#fff" stroke-width="2"/>';
      out += lines(tx, y + 14, r.hl2, 14, 700, C.ink, 19);
      out += lines(tx, y + 14 + r.hl2.length * 19 + 2, r.pl, 12, 400, C.sub, 16);
      y += r.h;
    });
    return frame(out, y, title, '');
  }

  function drawBlock(b, fromVideo) {
    const tag = fromVideo ? '영상 ' + (b.timestamp || '') : '쫑이 그림 정리';
    try {
      if (b.type === 'numbers') return drawNumbers(b, tag);
      if (b.type === 'flow') return drawFlow(b, tag);
      if (b.type === 'mindmap') return drawMindmap(b, tag);
      if (b.type === 'chart') return drawChart(b, tag);
    } catch (e) {}
    return null; // table·figure는 그림 대신 진짜 표·글로
  }

  // SVG → PNG(base64) : PDF에 넣기 위해
  function svgToPng(art) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const scale = 3, cv = document.createElement('canvas');
          cv.width = art.w * scale; cv.height = art.h * scale;
          const g = cv.getContext('2d');
          g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
          g.drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/png').split(',')[1]);
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(art.svg);
    });
  }

  // 모든 그림 만들기: 화면용 svg + PDF용 png
  async function buildArt(s) {
    const jobs = [];
    const add = (b, art) => { if (!art) return; b._svg = art.svg; jobs.push(svgToPng(art).then(p => { if (p) b.png = p; })); };
    if (s.mode !== 'text') {
      s.illustrations.forEach(b => add(b, drawBlock(b, false)));
      s.videoVisuals.forEach(b => add(b, drawBlock(b, true)));
    }
    if (s.mode === 'visual') {
      if (s.keyTakeaways.length) { s.pointsBlock = { type: 'points' }; add(s.pointsBlock, drawPoints(s.keyTakeaways.map(k => k.text), '')); }
      if (s.sections.length) { s.timelineBlock = { type: 'timeline' }; add(s.timelineBlock, drawTimeline(s.sections, '')); }
    }
    await Promise.all(jobs);
  }

  // 서버로 보낼 때는 화면용 svg는 빼고
  function forServer(s) {
    return JSON.parse(JSON.stringify(s, (k, v) => k === '_svg' ? undefined : v));
  }

  /* ---------- 결과 화면 ---------- */

  function htmlTable(headers, rows) {
    let h = '<div class="tbl"><table>';
    if (headers && headers.length) h += '<thead><tr>' + headers.map(x => '<th>' + hl(x) + '</th>').join('') + '</tr></thead>';
    h += '<tbody>' + rows.map(r => '<tr>' + r.map(x => '<td>' + hl(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    return h;
  }

  function blockHtml(b, videoUrl, fromVideo) {
    let h = '<div class="vis">';
    if (b._svg) {
      h += '<div class="art">' + b._svg + '</div>';
    } else {
      h += '<div class="vtitle">' + hl(b.title) + (fromVideo ? '' : ' <span class="vtag">쫑이 그림 정리</span>') + '</div>';
      if (b.type === 'table') h += htmlTable(b.headers, b.rows);
      else if (b.type === 'figure') h += '<p>' + hl(b.description) + '</p>';
      else if (b.type === 'flow') h += '<ol>' + b.steps.map(s => '<li><b>' + hl(s.title) + '</b> ' + hl(s.desc) + '</li>').join('') + '</ol>';
      else if (b.type === 'mindmap') h += '<p><b>' + hl(b.center) + '</b></p>' + list(b.branches.map(x => x.label + ': ' + x.items.join(', ')));
      else if (b.type === 'numbers') h += list(b.items.map(x => x.value + ' – ' + x.label));
      else if (b.type === 'chart') h += htmlTable(['항목'].concat(b.series.map(s => s.name || '값')), b.labels.map((l, i) => [l].concat(b.series.map(s => s.values[i] == null ? '' : s.values[i]))));
    }
    if (fromVideo && b.timestamp) {
      const sec = toSec(b.timestamp);
      if (sec != null) h += '<a class="jump" target="_blank" rel="noopener" href="' + esc(videoUrl + '&t=' + sec + 's') + '">▶ 영상 ' + esc(b.timestamp) + '에서 원본 보기</a>';
    }
    return h + '</div>';
  }

  // [3:12] 근거 시각 링크
  function evLink(t, videoUrl) {
    const sec = toSec(t);
    return sec == null ? '' : ' <a class="ev" target="_blank" rel="noopener" href="' + esc(videoUrl + '&t=' + sec + 's') + '">[' + esc(t) + ']</a>';
  }
  // 내용 + 근거 시각 + 영상 속 실제 말
  function pointsHtml(points, videoUrl) {
    if (!points || !points.length) return '';
    return '<ul>' + points.map(p => '<li>' + hl(p.text) + evLink(p.t, videoUrl) +
      (p.quote ? '<div class="quote">🗣 "' + esc(p.quote) + '"</div>' : '') + '</li>').join('') + '</ul>';
  }

  function factCheckHtml(fc) {
    if (!fc) return '';
    let h = '<h3>🔍 쫑이 팩트체크 리포트</h3><div class="fc">';
    h += '<div><b>검증 방식:</b> ' + esc(fc.method) + '</div>';
    if (fc.checked) h += '<div><b>고친 곳:</b> ' + fc.fixes + '군데</div>';
    const part = (title, a) => a && a.length ? '<div class="fcs"><b>' + title + '</b>' + list(a) + '</div>' : '';
    h += part('✏️ 이렇게 고쳤어요', fc.fixed) + part('🗑️ 영상에서 확인이 안 돼서 뺐어요', fc.removed) + part('🤔 아직 헷갈려요', fc.unsure);
    const a = fc.auto || {};
    const lines = [];
    if (a.noEvidence) lines.push('근거 시각이 없는 문장 ' + a.noEvidence + '개');
    if (a.numberNoQuote) lines.push('영상 속 말(인용)이 없는 숫자·이름 ' + a.numberNoQuote + '개');
    if (a.outOfRange) lines.push('영상 길이를 벗어난 시각 ' + a.outOfRange + '개');
    h += '<div class="fcs"><b>🤖 자동 점검</b>' +
      (lines.length ? list(lines.map(x => x + ' → ' + UNSURE + ' 표시함')) : '<p>근거 없는 문장 없음 👍</p>') + '</div>';
    h += '<p class="muted">AI는 그럴듯하게 지어낼 수 있어요(환각). 쫑이는 근거 시각·영상 속 인용·교차 검증으로 줄이지만 0으로 만들 수는 없어요. ' +
      '중요한 내용은 [시각]을 눌러 원본으로 확인하세요.</p>';
    return h + '</div>';
  }

  function renderResult(s, pdf, videoUrl) {
    $('statusCard').style.display = 'none';
    const id = videoIdOf(videoUrl);
    let html = '<div class="card done"><img src="' + HAPPY_DOG + '" alt="신난 쫑이">' +
      '<div class="yay">' + esc(DONE[Math.floor(Math.random() * DONE.length)]) + '</div>' +
      '<div class="btns"><a class="open" target="_blank" rel="noopener" href="' + esc(pdf.url) + '">PDF 보기</a>' +
      '<a class="open sub" target="_blank" rel="noopener" href="' + esc(pdf.download) + '">다운로드</a></div></div>';

    html += '<div class="card preview">';
    if (id) html += '<img class="thumb" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="">';
    html += '<h2>' + esc(s.title) + '</h2>';
    if (s.channel) html += '<div class="muted">' + esc(s.channel) + '</div>';
    if (s.check && s.check.done) html += '<div class="badge">🔍 쫑이 검증 완료 · ' + (s.check.fixes ? s.check.fixes + '군데 고쳤음' : '고칠 곳 없었음') + '</div>';
    if (s.oneLine) html += '<p class="one"><b>그래서 결론:</b> ' + hl(s.oneLine) + '</p>';

    if (s.keyTakeaways.length) {
      html += '<h3>핵심만 쏙</h3>';
      html += (s.mode === 'visual' && s.pointsBlock && s.pointsBlock._svg) ? '<div class="art">' + s.pointsBlock._svg + '</div>' : pointsHtml(s.keyTakeaways, videoUrl);
    }
    if (s.mode !== 'text' && s.illustrations.length) {
      html += '<h3>그림으로 한눈에</h3>' + s.illustrations.map(b => blockHtml(b, videoUrl, false)).join('');
    }
    if (s.sections.length) {
      if (s.mode === 'visual') {
        html += '<h3>영상 흐름</h3>';
        if (s.timelineBlock && s.timelineBlock._svg) html += '<div class="art">' + s.timelineBlock._svg + '</div>';
        html += '<div class="jumps">' + s.sections.map(sec => {
          const t = toSec(sec.timestamp);
          return t == null ? '' : '<a target="_blank" rel="noopener" href="' + esc(videoUrl + '&t=' + t + 's') + '">' + esc(sec.timestamp) + '</a>';
        }).join('') + '</div>';
      } else {
        html += '<h3>내용 정리</h3>';
        s.sections.forEach(sec => {
          const t = toSec(sec.timestamp);
          const ts = sec.timestamp ? (t != null ? '<a target="_blank" rel="noopener" href="' + esc(videoUrl + '&t=' + t + 's') + '">[' + esc(sec.timestamp) + ']</a> ' : '[' + esc(sec.timestamp) + '] ') : '';
          html += '<h4>' + ts + hl(sec.heading) + '</h4>' + pointsHtml(sec.points, videoUrl);
        });
      }
    }
    if (s.mode !== 'text' && s.videoVisuals.length) {
      html += '<h3>영상 화면 속 표·그래프·그림</h3><p class="muted">영상에 나온 자료를 쫑이가 옮겨 그렸어요. 원본은 링크를 누르면 그 장면으로 가요.</p>' +
        s.videoVisuals.map(b => blockHtml(b, videoUrl, true)).join('');
    } else if (s.visualNotes.length) {
      html += '<h3>화면에만 나온 정보</h3>' + list(s.visualNotes);
    }
    html += factCheckHtml(s.factCheck);
    html += '<p class="muted"><mark>' + esc(UNSURE) + '</mark> = 쫑이도 헷갈린 부분. 원본 영상으로 꼭 확인하기!<br>' +
      '※ 한나T가 쫑이랑 Gemini 시켜서 만든 요약임. 틀리면 Gemini 탓.</p></div>';
    $('result').innerHTML = html;
  }

  /* ---------- 버튼 ---------- */

  async function onGo() {
    const btn = $('go');
    if (btn.disabled) return;

    const id = videoIdOf($('url').value);
    if (!id) { setStatus('음… 이건 유튜브 링크가 아닌 것 같은데? 🤨\n유튜브 앱에서 공유 → 링크 복사 해서 붙여 넣어 줘.', true); return; }
    if (!API_KEY) { showLock(); return; }
    const videoUrl = 'https://www.youtube.com/watch?v=' + id;
    const opts = {
      detail: $('detail').value,
      mode: $('mode').value,
      speed: $('speed').value,
      check: $('verify').value
    };

    btn.disabled = true;
    btn.textContent = '쫑이가 보는 중… 🐾';
    askNotifyPermission();
    jobRunning = true; wasAway = false;
    keepAwake(true);
    $('result').innerHTML = '';
    jobStart = 0;
    setStatus('링크 받았음! 쫑이 분신술 준비 중 📏', false, true);
    showRoleClones();
    try {
      // 영상 길이·제목 알아오기 (실패하면 그냥 한 번에 보기)
      const info = await server('getVideoInfo', 20000, id, PW).catch(() => null);
      const summary = await summarize(videoUrl, opts, info);
      summary.mode = opts.mode;
      if (opts.mode === 'text') { summary.illustrations = []; summary.videoVisuals = []; }
      summary.factCheck.auto = audit(summary, info && info.seconds);
      rolesDone();
      clonesMerge();
      if (opts.mode !== 'text') {
        updateMsg('쫑이들 합체! 크레파스로 그림 그리는 중 🖍️');
        await buildArt(summary);
      }
      updateMsg('결론 다 나왔음. PDF로 말아서 포장하는 중 📦');
      const pdf = await server('makePdf', 5 * 60 * 1000, forServer(summary), videoUrl, PW);
      clearInterval(timer);
      renderResult(summary, pdf, videoUrl);
      notifyDone(true, (summary.title ? '「' + summary.title + '」 ' : '') + '결론 나왔어요. 눌러서 확인하세요!');
    } catch (e) {
      clearClones();
      setStatus(friendlyError(e), true);
      notifyDone(false, '앱을 열어서 무슨 일인지 확인해 주세요.');
    } finally {
      jobRunning = false;
      keepAwake(false);
      clearInterval(timer);
      jobStart = 0;
      btn.disabled = false;
      btn.textContent = '결론만 내놔 🐾';
    }
  }

  $('go').addEventListener('click', onGo);

  /* ---------- 페이지 열릴 때 점검 ---------- */

  /* ---------- 암호 (문지기 쫑이) ---------- */

  const PW_KEY = 'jjongi_pw';
  const WRONG = [
    '땡! 쫑이가 모르는 냄새야 🐽',
    '쫑이가 고개를 갸웃함… 다시 해 봐 🤨',
    '암호 틀림. 간식으로도 매수 안 됨 🍖🙅',
    '왈! (틀렸다는 뜻) 🐶',
    '한나T한테 암호 다시 물어보고 와 📱'
  ];
  const savePw = pw => { try { localStorage.setItem(PW_KEY, pw); } catch (e) {} };
  const loadPw = () => { try { return localStorage.getItem(PW_KEY) || ''; } catch (e) { return ''; } };
  function forgetPw() { try { localStorage.removeItem(PW_KEY); } catch (e) {} }

  function showLock(msg) {
    $('lockDog').src = document.querySelector('.hero img').src;
    $('lock').style.display = 'flex';
    $('pwmsg').textContent = msg || '';
    setTimeout(() => $('pw').focus(), 50);
  }
  function hideLock() { $('lock').style.display = 'none'; }

  // 결과: 'ok' / 'wrong' / 'nokey' / 'error'
  let lastServerError = '';
  async function tryUnlock(pw) {
    try {
      const r = await server('unlock', 20000, pw);
      if (r && r.ok) { API_KEY = r.apiKey; PW = pw; return 'ok'; }
      return (r && r.reason) || 'wrong';
    } catch (e) {
      lastServerError = (e && e.message) || String(e);
      return 'error';
    }
  }

  async function onPw() {
    const pw = $('pw').value.trim();
    if (!pw) { $('pwmsg').textContent = '암호를 입력해 줘 🐾'; return; }
    $('pwgo').disabled = true;
    $('pwmsg').textContent = '킁킁… 냄새 맡는 중 👃';
    const res = await tryUnlock(pw);
    $('pwgo').disabled = false;
    if (res === 'ok') {
      if ($('remember').checked) savePw(pw); else forgetPw();
      $('pwmsg').textContent = '아는 사람이다! 어서 와 🐶💛';
      setTimeout(hideLock, 700);
    } else if (res === 'wrong') {
      $('pwmsg').textContent = WRONG[Math.floor(Math.random() * WRONG.length)];
      $('pw').select();
    } else if (res === 'nokey') {
      $('pwmsg').textContent = '암호는 맞는데 Gemini 키가 설정 안 됐어요. 한나T에게 알려 주세요!';
    } else {
      $('pwmsg').textContent = '서버랑 연결이 안 돼요 😢\n(' + lastServerError + ')';
    }
  }
  $('pwgo').addEventListener('click', onPw);
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') onPw(); });

  /* ---------- 페이지 열릴 때 ---------- */

  document.title = "한나T의 '그래서 결론이 뭔데'";
  if (PREFILL) {
    $('url').value = 'https://youtu.be/' + PREFILL;
    $('prefillMsg').style.display = 'block';
  }
  window.addEventListener('load', async () => {
    // 저장해 둔 암호(없으면 빈 값)로 먼저 열어 보고, 암호가 필요하면 문지기 쫑이 등장
    const res = await tryUnlock(loadPw());
    if (res === 'ok') {
      hideLock();
    } else if (res === 'wrong') {
      forgetPw();
      showLock();
    } else if (res === 'nokey') {
      hideLock();
      showWarn('API 키가 설정되지 않았습니다.\n프로젝트 설정 → 스크립트 속성에 GEMINI_API_KEY를 추가한 뒤 "새 버전"으로 다시 배포하세요.');
    } else {
      showWarn('쫑이 서버와 연결되지 않아요 😢\n' +
        '(한나T에게: Apps Script에 새 Code.gs를 넣고 "배포 관리 → 새 버전"으로 배포했는지, 액세스가 "모든 사용자"인지 확인)\n' +
        '자세한 이유: ' + lastServerError);
    }
  });

  /* ---------- 앱 설치 ---------- */
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const IS_APP = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installEvt = e;
    if (!IS_APP) $('installBar').style.display = 'flex';
  });
  window.addEventListener('appinstalled', () => {
    $('installText').textContent = '설치 완료! 🎉 홈 화면의 "대신봐쫑"으로 열어 주세요';
    $('installBtn').style.display = 'none';
  });
  $('installBtn').addEventListener('click', async () => {
    if (!installEvt) return;
    installEvt.prompt();
    await installEvt.userChoice;
    installEvt = null;
    $('installBar').style.display = 'none';
  });
  if (!IS_APP && /iphone|ipad|ipod/i.test(navigator.userAgent)) {
    $('installText').textContent = '📲 아래 공유(□↑) → "홈 화면에 추가"로 앱처럼 쓸 수 있어요';
    $('installBtn').style.display = 'none';
    $('installBar').style.display = 'flex';
  }
</script>
</body>
</html>
